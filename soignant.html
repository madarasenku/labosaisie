<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes patients — Laboratoire CPMI</title>
<meta name="theme-color" content="#0b2545">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mes patients">
<link rel="stylesheet" href="./vendor/fonts/poppins.css?v=13.197">
<script src="./vendor/supabase-2.39.7.umd.js?v=13.197"></script>
<style>
  /* Page volontairement autonome : elle ne charge NI app.css NI les modules
     du laboratoire. Un soignant qui ouvre son portail sur un téléphone en
     4G instable ne doit pas télécharger l'application de saisie complète —
     et surtout, aucun code du registre ne doit pouvoir s'exécuter ici. */
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;
       background:#f0f4f8;color:#0b2545;font-size:15px;line-height:1.5}
  /* Dégradé signature de l'app (comme la sidebar / la page de connexion) */
  header{background:linear-gradient(135deg,#0b2545,#0096c7);color:#fff;padding:14px 18px;display:flex;
         align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:50;
         box-shadow:0 2px 14px rgba(11,37,69,.18)}
  /* Petit logo CPMI (tuile arrondie translucide, comme l'en-tête de l'app) */
  header .logo{width:38px;height:38px;flex:none;border-radius:11px;display:flex;
               align-items:center;justify-content:center;background:rgba(255,255,255,.13);
               border:1px solid rgba(255,255,255,.22)}
  header h1{font-size:17px;font-weight:600;flex:1;min-width:160px}
  header .qui{font-size:13px;opacity:.85}
  header button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:8px;
                padding:7px 13px;font:inherit;font-size:13px;cursor:pointer}
  header button:hover{background:rgba(255,255,255,.24)}
  main{max-width:920px;margin:0 auto;padding:16px}

  /* Barre de stats */
  .stats-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .stat-pill{background:#fff;border:1px solid #dae4ee;border-radius:10px;
             padding:9px 16px;display:flex;align-items:center;gap:8px;font-size:14px}
  .stat-pill .num{font-size:22px;font-weight:700;line-height:1}
  .stat-pill.cours .num{color:#d97706}
  .stat-pill.rendu .num{color:#16a34a}
  .stat-pill.total .num{color:#0b2545}

  /* Barre de filtres */
  .barre{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .barre input,.barre select{padding:9px 12px;border:1.5px solid #dae4ee;border-radius:10px;
                             font:inherit;background:#fff;color:#0b2545;outline:none;
                             transition:border-color .15s,box-shadow .15s}
  .barre input:focus,.barre select:focus{border-color:#0096c7;box-shadow:0 0 0 3px rgba(0,150,199,.12)}
  .barre input[type=search]{flex:1;min-width:200px}

  /* Carte patient */
  .fiche{background:#fff;border:1px solid #dae4ee;border-radius:12px;
         margin-bottom:9px;overflow:hidden;transition:border-color .12s,box-shadow .12s}
  .fiche:hover{border-color:#0096c7;box-shadow:0 2px 10px rgba(11,37,69,.10)}
  .fiche-en-tete{padding:13px 15px;cursor:pointer;display:flex;
                 gap:12px;align-items:center;border-left:4px solid transparent}
  .fiche.cours .fiche-en-tete{border-left-color:#d97706}
  .fiche.rendu .fiche-en-tete{border-left-color:#059669}
  .fiche .nom{font-weight:600}
  .fiche .meta{font-size:13px;color:#4a607a}
  .fiche .droite{margin-left:auto;text-align:right;white-space:nowrap}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .b-rendu{background:#dcfce7;color:#166534}
  .b-cours{background:#fef3c7;color:#92400e}
  .examens-pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
  .exam-pill{background:#f1f5f9;border-radius:6px;padding:2px 8px;
             font-size:12px;color:#475569}

  /* Corps de la carte (résultats inline) */
  .fiche-corps{display:none;padding:0 15px 14px 19px;border-top:1px solid #f1f5f9}
  .fiche.ouvert .fiche-corps{display:block}
  .avert{background:#fef3c7;border:1px solid #fcd34d;color:#78350f;border-radius:10px;
         padding:10px 13px;margin:10px 0;font-size:13px}
  .avert strong{display:block;margin-bottom:2px}
  .recap-table{width:100%;border-collapse:collapse;margin-top:10px}
  .recap-table th,.recap-table td{text-align:left;padding:7px 6px;
         border-bottom:1px solid #f1f5f9;font-size:13px}
  .recap-table th{color:#4a607a;font-weight:600;font-size:12px}
  .recap-table td.valeur{font-weight:700;text-align:right;white-space:nowrap;color:#0b2545}
  .pas-encore{color:#94a3b8;font-size:13px;font-style:italic;margin-top:10px}
  .fiche-corps-chargement{color:#94a3b8;font-size:13px;margin-top:10px}

  .vide{text-align:center;color:#4a607a;padding:38px 12px}

  @media print{
    header,.barre,.stats-bar{display:none!important}
    .fiche{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
    .fiche-corps{display:block!important}
  }
</style>
</head>
<body>

<header>
  <span class="logo" aria-hidden="true">
    <svg viewBox="0 0 64 64" width="24" height="24" xmlns="http://www.w3.org/2000/svg">
      <path d="M32 16c-5.5 0-10 4.2-10 10.5 0 4.8 2.9 9 7 11.3v3.4c-4.5 1-8 3.6-9.4 7h25c-1.4-3.5-5-6-9.6-7v-3.4c4.1-2.3 7-6.5 7-11.3C42 20.2 37.5 16 32 16z" fill="#fff"/>
      <circle cx="32" cy="14" r="3.4" fill="#fff"/>
      <g><rect x="46" y="40" width="3.2" height="11" rx="1.2" fill="#00b4d8"/><rect x="41.4" y="44.4" width="11" height="3.2" rx="1.2" fill="#00b4d8"/></g>
    </svg>
  </span>
  <h1>Mes patients au laboratoire</h1>
  <span class="qui" id="qui"></span>
  <button type="button" id="btn-quitter">Se déconnecter</button>
</header>

<main>
  <!-- Barre de statistiques -->
  <div class="stats-bar" id="stats-bar" style="display:none!important"></div>

  <div class="barre">
    <input type="search" id="recherche" placeholder="Rechercher un nom ou un n° de dossier…"
           autocomplete="off">
    <select id="filtre-statut">
      <option value="">Tous les statuts</option>
      <option value="rendu">Résultats rendus</option>
      <option value="cours">En cours</option>
    </select>
  </div>
  <div id="liste"><div class="vide">Chargement…</div></div>
</main>

<script>
/* Mêmes clés préfixées que le reste du site secondaire : le localStorage est
   partagé par tout le domaine (voir README). */
const SESSION_KEY = 'labo_session_user';
const SUPABASE_URL = 'https://uvxxbihlagfncraokqlg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_RPgz6piVcNONZOOcLmOCQw_5YPxZTd6';

let _sb = null, _session = null, _fiches = [];
/* Cache des détails déjà chargés : { [id]: data } */
const _cache = {};

function lireSession() {
  try {
    const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    if (!s || !s.token || !s.expiresAt || Date.now() > s.expiresAt) return null;
    return s;
  } catch (e) { return null; }
}

function versLogin() { window.location.replace('login.html'); }

function echapper(t) {
  return String(t ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function jourLisible(d) {
  if (!d) return '';
  const [a, m, j] = String(d).split('-');
  return j && m && a ? `${j}/${m}/${a}` : d;
}

/* ── Barre de stats ─────────────────────────────────────────────────────── */
function mettreAJourStats() {
  const bar = document.getElementById('stats-bar');
  if (!_fiches.length) { bar.style.display = 'none'; return; }
  const cours = _fiches.filter(x => !x.rendu).length;
  const rendu = _fiches.filter(x =>  x.rendu).length;
  bar.innerHTML =
    `<div class="stat-pill total"><span class="num">${_fiches.length}</span>patient${_fiches.length>1?'s':''} adressé${_fiches.length>1?'s':''}</div>` +
    (cours ? `<div class="stat-pill cours"><span class="num">${cours}</span>en cours</div>` : '') +
    (rendu ? `<div class="stat-pill rendu"><span class="num">${rendu}</span>rendu${rendu>1?'s':''}</div>` : '');
  bar.style.removeProperty('display');
}

/* ── Liste ──────────────────────────────────────────────────────────────── */
function dessinerListe() {
  const q = document.getElementById('recherche').value.trim().toLowerCase();
  const f = document.getElementById('filtre-statut').value;
  let vus = _fiches.filter(x => {
    if (f === 'rendu' && !x.rendu) return false;
    if (f === 'cours' && x.rendu)  return false;
    if (!q) return true;
    return (x.nom || '').toLowerCase().includes(q)
        || (x.dossier || '').toLowerCase().includes(q);
  });

  /* En cours en premier, puis les rendus, chacun par date décroissante */
  vus.sort((a, b) => {
    if (a.rendu !== b.rendu) return a.rendu ? 1 : -1;
    return (b.date_prelevement || '').localeCompare(a.date_prelevement || '');
  });

  const el = document.getElementById('liste');
  if (!vus.length) {
    el.innerHTML = '<div class="vide">' +
      (_fiches.length ? 'Aucun patient ne correspond à cette recherche.'
                      : 'Aucun patient adressé au laboratoire pour le moment.') +
      '</div>';
    return;
  }

  el.innerHTML = vus.map(x => {
    const pillsHTML = (x.examens || []).map(e =>
      `<span class="exam-pill">${echapper(e)}</span>`).join('');
    return `
    <div class="fiche ${x.rendu ? 'rendu' : 'cours'}" data-id="${x.id}">
      <div class="fiche-en-tete">
        <div style="flex:1;min-width:0">
          <div class="nom">${echapper(x.nom || 'Sans nom')}</div>
          <div class="meta">N° ${echapper(x.dossier || '—')}
            · ${echapper(x.age || '')} ${echapper(x.sexe || '')}</div>
          ${pillsHTML ? `<div class="examens-pills">${pillsHTML}</div>` : ''}
        </div>
        <div class="droite">
          <span class="badge ${x.rendu ? 'b-rendu' : 'b-cours'}">${x.rendu ? 'Rendu' : 'En cours'}</span>
          <div class="meta">${jourLisible(x.date_prelevement)}</div>
        </div>
      </div>
      <div class="fiche-corps" id="corps-${x.id}"></div>
    </div>`;
  }).join('');

  el.querySelectorAll('.fiche').forEach(n =>
    n.querySelector('.fiche-en-tete').addEventListener('click', () =>
      basculerFiche(Number(n.dataset.id), n)));
}

/* ── Résultats inline ───────────────────────────────────────────────────── */
async function basculerFiche(id, noeud) {
  const estOuvert = noeud.classList.contains('ouvert');

  /* Fermer toutes les autres */
  document.querySelectorAll('.fiche.ouvert').forEach(f => f.classList.remove('ouvert'));

  if (estOuvert) return; /* simple toggle : clic sur la même = ferme */

  noeud.classList.add('ouvert');
  const corps = document.getElementById(`corps-${id}`);

  /* Si déjà en cache, afficher directement */
  if (_cache[id]) { afficherDetail(corps, _cache[id]); return; }

  corps.innerHTML = '<div class="fiche-corps-chargement">Chargement…</div>';

  const { data, error } = await _sb.rpc('get_prescription_full',
    { p_token: _session.token, p_id: id });

  if (error || !data || data.erreur) {
    corps.innerHTML = '<div class="pas-encore">Ce dossier ne vous est pas accessible.</div>';
    return;
  }

  _cache[id] = data;
  afficherDetail(corps, data);
}

function afficherDetail(corps, data) {
  const lignes = Object.entries(data.resultats || {});
  let html = '';

  if (!data.valide) {
    html += '<div class="avert">'
         +  '<strong>⏳ En cours — résultat non validé</strong>'
         +  'Ces valeurs sont provisoires et peuvent encore changer. '
         +  'Attendez la mention <strong>Rendu</strong> avant de fonder une décision dessus.</div>';
  }

  if (lignes.length) {
    html += '<table class="recap-table">'
         +  '<thead><tr><th>Analyse</th><th style="text-align:right">Résultat</th></tr></thead>'
         +  '<tbody>'
         +  lignes.map(([k, v]) =>
              `<tr><td>${echapper(k)}</td><td class="valeur">${echapper(v)}</td></tr>`
            ).join('')
         +  '</tbody></table>';
  } else {
    html += '<div class="pas-encore">Prélèvement enregistré — aucune valeur saisie pour l\'instant.</div>';
  }

  corps.innerHTML = html;
}

/* ── Chargement initial ─────────────────────────────────────────────────── */
async function charger() {
  const { data, error } = await _sb.rpc('get_mes_prescriptions', { p_token: _session.token });
  if (error) {
    document.getElementById('liste').innerHTML =
      '<div class="vide">Impossible de joindre le laboratoire.<br>' +
      'Vérifiez votre connexion, puis réessayez.</div>';
    return;
  }
  _fiches = Array.isArray(data) ? data : [];
  mettreAJourStats();
  dessinerListe();
}

document.addEventListener('DOMContentLoaded', () => {
  _session = lireSession();
  if (!_session) return versLogin();
  if (_session.role !== 'prescripteur') { window.location.replace('index.html'); return; }

  document.getElementById('qui').textContent = _session.username || '';
  _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  document.getElementById('recherche').addEventListener('input', dessinerListe);
  document.getElementById('filtre-statut').addEventListener('change', dessinerListe);
  document.getElementById('btn-quitter').addEventListener('click', async () => {
    try { await _sb.rpc('logout_token', { p_token: _session.token }); } catch (e) {}
    localStorage.removeItem(SESSION_KEY);
    versLogin();
  });

  charger();
});
</script>
</body>
</html>
