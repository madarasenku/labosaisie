<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes patients — Laboratoire CPMI</title>
<meta name="theme-color" content="#0b2545">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mes patients">
<link rel="stylesheet" href="./vendor/fonts/poppins.css?v=13.93">
<script src="./vendor/supabase-2.39.7.umd.js?v=13.93"></script>
<style>
  /* Page volontairement autonome : elle ne charge NI app.css NI les modules
     du laboratoire. Un soignant qui ouvre son portail sur un téléphone en
     4G instable ne doit pas télécharger l'application de saisie complète —
     et surtout, aucun code du registre ne doit pouvoir s'exécuter ici. */
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;
       background:#f1f5f9;color:#0f172a;font-size:15px;line-height:1.5}
  header{background:#0b2545;color:#fff;padding:14px 18px;display:flex;
         align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
  header h1{font-size:17px;font-weight:600;flex:1;min-width:180px}
  header .qui{font-size:13px;opacity:.85}
  header button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:8px;
                padding:7px 13px;font:inherit;font-size:13px;cursor:pointer}
  header button:hover{background:rgba(255,255,255,.24)}
  main{max-width:920px;margin:0 auto;padding:16px}
  .barre{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .barre input,.barre select{padding:9px 12px;border:1px solid #cbd5e1;border-radius:9px;
                             font:inherit;background:#fff}
  .barre input[type=search]{flex:1;min-width:200px}
  .fiche{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:13px 15px;
         margin-bottom:9px;cursor:pointer;display:flex;gap:12px;align-items:center;
         transition:border-color .12s,box-shadow .12s}
  .fiche:hover{border-color:#94a3b8;box-shadow:0 2px 8px rgba(15,23,42,.07)}
  .fiche .nom{font-weight:600}
  .fiche .meta{font-size:13px;color:#64748b}
  .fiche .droite{margin-left:auto;text-align:right;white-space:nowrap}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .b-rendu{background:#dcfce7;color:#166534}
  .b-cours{background:#fef3c7;color:#92400e}
  .vide{text-align:center;color:#64748b;padding:38px 12px}
  .avert{background:#fef3c7;border:1px solid #fcd34d;color:#78350f;border-radius:10px;
         padding:11px 14px;margin-bottom:14px;font-size:14px}
  dialog{border:0;border-radius:14px;padding:0;max-width:640px;width:calc(100% - 24px);
         box-shadow:0 20px 50px rgba(15,23,42,.28)}
  dialog::backdrop{background:rgba(15,23,42,.5)}
  .det-tete{padding:16px 18px;border-bottom:1px solid #e2e8f0;display:flex;
            align-items:flex-start;gap:12px}
  .det-tete h2{font-size:17px}
  .det-corps{padding:16px 18px;max-height:60vh;overflow:auto}
  .det-pied{padding:12px 18px;border-top:1px solid #e2e8f0;display:flex;gap:9px;justify-content:flex-end}
  .det-pied button{padding:9px 15px;border-radius:9px;border:1px solid #cbd5e1;
                   background:#fff;font:inherit;cursor:pointer}
  .det-pied .principal{background:#0b2545;color:#fff;border-color:#0b2545}
  table{width:100%;border-collapse:collapse;margin-top:10px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #f1f5f9;font-size:14px}
  th{color:#64748b;font-weight:600;font-size:13px}
  td.valeur{font-weight:600;text-align:right;white-space:nowrap}
  @media print{
    header,.barre,.det-pied,#bandeau-site-v2{display:none!important}
    dialog{position:static;box-shadow:none;max-width:none}
  }
</style>
</head>
<body>

<!-- ⚠️ SITE SECONDAIRE — voir le commentaire dans index.html -->
<div id="bandeau-site-v2" role="status">
  ⚠️ SITE SECONDAIRE — base de données distincte de la production.
  <span>Les saisies faites ici ne remontent PAS sur le site principal.</span>
</div>
<style>
  #bandeau-site-v2{position:sticky;top:0;z-index:99999;background:#c2410c;color:#fff;
    font:600 13px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;
    padding:7px 12px;letter-spacing:.2px;box-shadow:0 2px 6px rgba(0,0,0,.28)}
  #bandeau-site-v2 span{display:block;font-weight:400;opacity:.92;font-size:12px}
  @media print{#bandeau-site-v2{display:none}}
</style>

<header>
  <h1>Mes patients au laboratoire</h1>
  <span class="qui" id="qui"></span>
  <button type="button" id="btn-quitter">Se déconnecter</button>
</header>

<main>
  <div class="barre">
    <input type="search" id="recherche" placeholder="Rechercher un nom ou un n° de dossier…"
           autocomplete="off">
    <select id="filtre-statut">
      <option value="">Tous les statuts</option>
      <option value="rendu">Résultats rendus</option>
      <option value="cours">En cours</option>
    </select>
  </div>
  <div id="liste"><div class="vide">Chargement…</div></div>
</main>

<dialog id="detail">
  <div class="det-tete">
    <div style="flex:1">
      <h2 id="det-nom">—</h2>
      <div class="meta" id="det-meta" style="font-size:13px;color:#64748b"></div>
    </div>
    <span class="badge" id="det-badge"></span>
  </div>
  <div class="det-corps" id="det-corps"></div>
  <div class="det-pied">
    <button type="button" onclick="window.print()">Imprimer</button>
    <button type="button" class="principal" id="det-fermer">Fermer</button>
  </div>
</dialog>

<script>
/* Mêmes clés préfixées que le reste du site secondaire : le localStorage est
   partagé par tout le domaine (voir README). */
const SESSION_KEY = 'v2_labo_session_user';
const SUPABASE_URL = 'https://ftwsxdivwoczsreiohok.supabase.co';
const SUPABASE_KEY = 'sb_publishable_de9EPaXmi3QSXMqSSoGuKg_kwWw9Yth';

let _sb = null, _session = null, _fiches = [];

function lireSession() {
  try {
    const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    if (!s || !s.token || !s.expiresAt || Date.now() > s.expiresAt) return null;
    return s;
  } catch (e) { return null; }
}

function versLogin() { window.location.replace('login.html'); }

function echapper(t) {
  return String(t ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function jourLisible(d) {
  if (!d) return '';
  const [a, m, j] = String(d).split('-');
  return j && m && a ? `${j}/${m}/${a}` : d;
}

function dessinerListe() {
  const q = document.getElementById('recherche').value.trim().toLowerCase();
  const f = document.getElementById('filtre-statut').value;
  const vus = _fiches.filter(x => {
    if (f === 'rendu' && !x.rendu) return false;
    if (f === 'cours' && x.rendu)  return false;
    if (!q) return true;
    return (x.nom || '').toLowerCase().includes(q)
        || (x.dossier || '').toLowerCase().includes(q);
  });

  const el = document.getElementById('liste');
  if (!vus.length) {
    el.innerHTML = '<div class="vide">' +
      (_fiches.length ? 'Aucun patient ne correspond à cette recherche.'
                      : 'Aucun patient adressé au laboratoire pour le moment.') +
      '</div>';
    return;
  }

  el.innerHTML = vus.map(x => `
    <div class="fiche" data-id="${x.id}">
      <div>
        <div class="nom">${echapper(x.nom || 'Sans nom')}</div>
        <div class="meta">N° ${echapper(x.dossier || '—')}
          · ${echapper(x.age || '')} ${echapper(x.sexe || '')}
          · ${echapper((x.examens || []).join(', '))}</div>
      </div>
      <div class="droite">
        <span class="badge ${x.rendu ? 'b-rendu' : 'b-cours'}">${x.rendu ? 'Rendu' : 'En cours'}</span>
        <div class="meta">${jourLisible(x.date_prelevement)}</div>
      </div>
    </div>`).join('');

  el.querySelectorAll('.fiche').forEach(n =>
    n.addEventListener('click', () => ouvrirFiche(Number(n.dataset.id))));
}

async function ouvrirFiche(id) {
  const d = document.getElementById('detail');
  document.getElementById('det-corps').innerHTML = '<div class="vide">Chargement…</div>';
  if (!d.open) d.showModal();

  const { data, error } = await _sb.rpc('get_prescription_full',
    { p_token: _session.token, p_id: id });

  if (error || !data || data.erreur) {
    document.getElementById('det-nom').textContent = 'Résultat indisponible';
    document.getElementById('det-meta').textContent = '';
    document.getElementById('det-badge').textContent = '';
    document.getElementById('det-corps').innerHTML =
      '<div class="vide">Ce dossier ne vous est pas accessible.</div>';
    return;
  }

  const p = data.patient || {};
  document.getElementById('det-nom').textContent = p.nom || 'Sans nom';
  document.getElementById('det-meta').textContent =
    `N° ${p.dossier || '—'} · ${p.age || ''} ${p.sexe || ''} · ${jourLisible(p.date)}`;
  const badge = document.getElementById('det-badge');
  badge.textContent = data.valide ? 'Rendu' : 'En cours';
  badge.className = 'badge ' + (data.valide ? 'b-rendu' : 'b-cours');

  const lignes = Object.entries(data.resultats || {});
  let html = '';

  // Le laboratoire a choisi de montrer les valeurs dès la saisie, pour les
  // urgences. Le prix de ce choix est cet avertissement : sans lui, un
  // chiffre provisoire serait recopié dans un dossier comme définitif.
  if (!data.valide) {
    html += '<div class="avert"><strong>Résultat non validé.</strong> '
         +  'Ces valeurs sont en cours de vérification par le laboratoire et '
         +  'peuvent encore changer. Attendez la mention « Rendu » avant de '
         +  'fonder une décision dessus.</div>';
  }

  html += '<div class="meta" style="font-size:13px;color:#64748b">Examens demandés : '
       +  echapper((data.types || [data.type]).join(', ')) + '</div>';

  html += lignes.length
    ? '<table><thead><tr><th>Analyse</th><th style="text-align:right">Résultat</th></tr></thead><tbody>'
      + lignes.map(([k, v]) =>
          `<tr><td>${echapper(k)}</td><td class="valeur">${echapper(v)}</td></tr>`).join('')
      + '</tbody></table>'
    : '<div class="vide">Prélèvement enregistré, aucune valeur saisie pour l\'instant.</div>';

  document.getElementById('det-corps').innerHTML = html;
}

async function charger() {
  const { data, error } = await _sb.rpc('get_mes_prescriptions', { p_token: _session.token });
  if (error) {
    document.getElementById('liste').innerHTML =
      '<div class="vide">Impossible de joindre le laboratoire.<br>' +
      'Vérifiez votre connexion, puis réessayez.</div>';
    return;
  }
  _fiches = Array.isArray(data) ? data : [];
  dessinerListe();
}

document.addEventListener('DOMContentLoaded', () => {
  _session = lireSession();
  // Ceinture et bretelles : le serveur refuse déjà tout à un non-soignant,
  // mais autant ne pas afficher une page vide à un agent égaré.
  if (!_session) return versLogin();
  if (_session.role !== 'prescripteur') { window.location.replace('index.html'); return; }

  document.getElementById('qui').textContent = _session.username || '';
  _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  document.getElementById('recherche').addEventListener('input', dessinerListe);
  document.getElementById('filtre-statut').addEventListener('change', dessinerListe);
  document.getElementById('det-fermer').addEventListener('click',
    () => document.getElementById('detail').close());
  document.getElementById('btn-quitter').addEventListener('click', async () => {
    try { await _sb.rpc('logout_token', { p_token: _session.token }); } catch (e) {}
    localStorage.removeItem(SESSION_KEY);
    versLogin();
  });

  charger();
});
</script>
</body>
</html>
