<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: 'Poppins', system-ui, sans-serif;
}
html {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  background: #e6edf3;
}
::selection { background: rgba(0,180,216,.25); color: #0b2545; }

/* ── Layout racine ── */
body {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  background: #f0f4f8;
}

/* Écrans très larges : recentrer élégamment */
@media (min-width: 1800px) {
  body {
    max-width: 1720px;
    margin: 0 auto;
    box-shadow: 0 0 90px rgba(11,37,69,.16);
  }
}

/* ══════════════════════════
   PANNEAU GAUCHE — Marque
══════════════════════════ */
.panel-brand {
  flex: 0 0 42%;
  background: #0b2545;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 48px 40px 40px;
}

/* Cercles décoratifs de fond */
.panel-brand::before {
  content: '';
  position: absolute;
  width: 420px; height: 420px;
  border-radius: 50%;
  background: rgba(255,255,255,.04);
  top: -140px; right: -140px;
  pointer-events: none;
}
.panel-brand::after {
  content: '';
  position: absolute;
  width: 280px; height: 280px;
  border-radius: 50%;
  background: rgba(255,255,255,.04);
  bottom: -80px; left: -80px;
  pointer-events: none;
}

/* Cercle accent couleur */
.brand-circle {
  position: absolute;
  width: 180px; height: 180px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(0,180,216,.22), rgba(0,119,182,.08));
  bottom: 140px; right: -40px;
  pointer-events: none;
}

.brand-top {
  position: relative;
  z-index: 1;
  animation: fadeInLeft .7s cubic-bezier(.22,.61,.36,1) both;
}

/* Logo icône */
.brand-icon-wrap {
  width: 70px; height: 70px;
  background: rgba(255,255,255,.1);
  border: 1.5px solid rgba(255,255,255,.2);
  border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 32px;
  backdrop-filter: blur(4px);
}

/* Trait de couleur à gauche du titre */
.brand-eyebrow {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.brand-eyebrow-line {
  width: 28px; height: 3px;
  background: linear-gradient(to right, #00b4d8, #0096c7);
  border-radius: 2px;
  flex-shrink: 0;
}
.brand-eyebrow-text {
  font-size: 10.5px;
  font-weight: 600;
  color: #00b4d8;
  letter-spacing: 2.5px;
  text-transform: uppercase;
}

.brand-name {
  font-size: clamp(40px, 4.2vw, 56px);
  font-weight: 800;
  color: #ffffff;
  letter-spacing: 4px;
  line-height: 1;
  margin-bottom: 12px;
}

.brand-full-name {
  font-size: 13.5px;
  font-weight: 400;
  color: rgba(255,255,255,.65);
  line-height: 1.5;
  max-width: 220px;
}

.brand-divider {
  width: 36px; height: 2px;
  background: rgba(255,255,255,.15);
  border-radius: 2px;
  margin: 22px 0;
}

.brand-tagline {
  font-size: 15px;
  font-weight: 300;
  font-style: italic;
  color: rgba(255,255,255,.5);
  line-height: 1.6;
  max-width: 210px;
}

/* Bas du panneau gauche */
.brand-bottom {
  position: relative;
  z-index: 1;
  animation: fadeInLeft .7s .15s cubic-bezier(.22,.61,.36,1) both;
}

.brand-location {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11.5px;
  color: rgba(255,255,255,.4);
  font-weight: 500;
  letter-spacing: .5px;
}
.brand-location svg { flex-shrink: 0; opacity: .7; }

.brand-badges {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 16px;
}
.brand-badge {
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: rgba(255,255,255,.35);
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 100px;
  padding: 4px 10px;
}

/* Grande croix médicale décorative */
.deco-cross {
  position: absolute;
  right: -20px;
  top: 50%;
  transform: translateY(-50%);
  opacity: .05;
  pointer-events: none;
  z-index: 0;
}

/* ══════════════════════════
   PANNEAU DROIT — Formulaire
══════════════════════════ */
.panel-form {
  flex: 1;
  background: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 40px;
  position: relative;
  overflow: hidden;
}

/* Légère texture de fond blanc */
.panel-form::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    radial-gradient(circle at 90% 10%, rgba(0,180,216,.06) 0%, transparent 50%),
    radial-gradient(circle at 10% 90%, rgba(11,37,69,.04) 0%, transparent 50%);
  pointer-events: none;
}

.form-inner {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 380px;
  animation: fadeInRight .7s cubic-bezier(.22,.61,.36,1) both;
}

/* Mini logo mobile (caché sur desktop) */
.form-mobile-logo {
  display: none;
  align-items: center;
  gap: 12px;
  margin-bottom: 32px;
}
.form-mobile-logo-icon {
  width: 46px; height: 46px;
  background: #0b2545;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.form-mobile-logo-text {
  font-size: 22px;
  font-weight: 800;
  color: #0b2545;
  letter-spacing: 3px;
}

/* Titre formulaire */
.form-eyebrow {
  font-size: 10.5px;
  font-weight: 600;
  color: #00b4d8;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.form-eyebrow::before {
  content: '';
  display: block;
  width: 20px; height: 2px;
  background: #00b4d8;
  border-radius: 2px;
  flex-shrink: 0;
}

.form-title {
  font-size: clamp(24px, 2.4vw, 32px);
  font-weight: 700;
  color: #0b2545;
  line-height: 1.15;
  margin-bottom: 6px;
  letter-spacing: -.3px;
}
.form-sub {
  font-size: 13px;
  color: #8599b0;
  font-weight: 400;
  margin-bottom: 36px;
  line-height: 1.5;
}

/* ── Champs ── */
.field {
  margin-bottom: 20px;
}
.field label {
  display: block;
  font-size: 11.5px;
  font-weight: 600;
  color: #4a607a;
  letter-spacing: .4px;
  margin-bottom: 8px;
  text-transform: uppercase;
}

.field-inner {
  position: relative;
}

.field-icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #a0b4c8;
}

.field input {
  width: 100%;
  padding: 14px 16px 14px 46px;
  background: #f7fafd;
  border: 1.5px solid #dae4ee;
  border-radius: 10px;
  font-size: 14.5px;
  font-family: inherit;
  color: #0b2545;
  font-weight: 500;
  outline: none;
  transition: border-color .2s, background .2s, box-shadow .2s;
  -webkit-appearance: none;
  min-height: 52px;
}
.field input::placeholder {
  color: #b8c9d9;
  font-weight: 400;
}
.field input:focus {
  border-color: #0096c7;
  background: #fff;
  box-shadow: 0 0 0 3px rgba(0,150,199,.12);
}
/* Label + icône réactifs quand le champ est actif */
.field:focus-within label { color: #0096c7; }
.field:focus-within .field-icon { color: #0096c7; }
.field label, .field-icon { transition: color .2s ease; }

/* Autofill : pas de flash jaune navigateur */
.field input:-webkit-autofill,
.field input:-webkit-autofill:hover,
.field input:-webkit-autofill:focus {
  -webkit-box-shadow: 0 0 0 60px #f7fafd inset;
  -webkit-text-fill-color: #0b2545;
  caret-color: #0b2545;
  transition: background-color 9999s ease-in-out 0s;
}

/* Bouton œil — afficher/masquer le mot de passe */
.pwd-toggle {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  background: transparent;
  border: none;
  border-radius: 8px;
  color: #a0b4c8;
  cursor: pointer;
  transition: color .2s ease, background .2s ease;
  padding: 0;
}
.pwd-toggle:hover { color: #0096c7; background: rgba(0,150,199,.08); }
.pwd-toggle:focus-visible { outline: 2px solid #00b4d8; outline-offset: 1px; }
.field-inner:has(.pwd-toggle) input { padding-right: 50px; }

/* ── Bouton ── */
.btn-login {
  width: 100%;
  min-height: 52px;
  padding: 14px 24px;
  background: #0b2545;
  border: none;
  border-radius: 10px;
  color: #fff;
  font-size: 14.5px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  letter-spacing: .5px;
  text-transform: uppercase;
  position: relative;
  overflow: hidden;
  transition: background .2s, transform .15s, box-shadow .2s;
  box-shadow: 0 4px 24px rgba(11,37,69,.25);
  margin-top: 10px;
}
.btn-login::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(0,180,216,.22) 0%, transparent 60%);
  opacity: 0;
  transition: opacity .3s;
  pointer-events: none;
}
.btn-login:hover:not(:disabled) {
  background: #0d2d56;
  box-shadow: 0 6px 32px rgba(11,37,69,.35);
  transform: translateY(-1px);
}
.btn-login:hover:not(:disabled)::after { opacity: 1; }
.btn-login:active { transform: translateY(0) scale(.99); }
.btn-login:disabled { opacity: .6; cursor: not-allowed; }
.btn-login:focus-visible { outline: 2px solid #00b4d8; outline-offset: 3px; }

/* Accent teal sur le bouton */
.btn-login .btn-accent {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
  background: linear-gradient(to bottom, #00b4d8, #0096c7);
  border-radius: 10px 0 0 10px;
}

/* ── Séparateur de sécurité ── */
.form-security {
  margin-top: 28px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.form-security-line {
  flex: 1;
  height: 1px;
  background: #e8eef4;
}
.form-security-text {
  font-size: 10px;
  color: #b8c9d9;
  font-weight: 500;
  letter-spacing: .5px;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 5px;
}

/* ── Erreur ── */
#login-error {
  color: #e05252;
  font-size: 12.5px;
  font-weight: 500;
  margin-top: 12px;
  min-height: 16px;
  line-height: 1.5;
  border-radius: 8px;
}
#login-error:not(:empty) {
  padding: 10px 14px;
  background: rgba(224,82,82,.07);
  border: 1px solid rgba(224,82,82,.18);
  animation: fadeInRight .25s ease both;
}

/* ── Spinner ── */
.spinner {
  display: inline-block;
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .7s linear infinite;
  vertical-align: middle;
  margin-right: 8px;
}

/* ── Shake ── */
.form-inner.shake { animation: shakeX .4s ease; }

/* ── Animations ── */
@keyframes fadeInLeft {
  from { opacity: 0; transform: translateX(-24px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes fadeInRight {
  from { opacity: 0; transform: translateX(24px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes shakeX {
  0%, 100%      { transform: translateX(0); }
  20%, 60%      { transform: translateX(-7px); }
  40%, 80%      { transform: translateX(7px); }
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ══════════════════════════
   RESPONSIVE MOBILE
══════════════════════════ */
@media (max-width: 768px) {
  body {
    flex-direction: column;
    background: #fff;
  }

  /* Panneau gauche → bandeau compact en haut (respect encoche iOS) */
  .panel-brand {
    flex: none;
    padding: calc(28px + env(safe-area-inset-top, 0px)) 24px 24px;
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    gap: 16px;
    min-height: auto;
  }
  .panel-brand::before,
  .panel-brand::after,
  .brand-circle,
  .deco-cross { display: none; }
  .brand-top {
    display: flex;
    align-items: center;
    gap: 14px;
    flex: 1;
  }
  .brand-icon-wrap {
    width: 52px; height: 52px;
    border-radius: 14px;
    margin-bottom: 0;
    flex-shrink: 0;
  }
  .brand-eyebrow,
  .brand-divider,
  .brand-tagline { display: none; }
  .brand-name {
    font-size: 30px;
    letter-spacing: 3px;
    margin-bottom: 2px;
  }
  .brand-full-name {
    font-size: 11px;
    max-width: 200px;
  }
  .brand-bottom { display: none; }

  /* Panneau droit → plein écran */
  .panel-form {
    flex: 1;
    padding: 32px 24px calc(40px + env(safe-area-inset-bottom, 0px));
    align-items: flex-start;
  }
  .form-inner { max-width: 100%; }
}

/* ── Téléphone en paysage : retour au split horizontal compact ── */
@media (max-width: 900px) and (max-height: 480px) and (orientation: landscape) {
  body { flex-direction: row; }
  .panel-brand {
    flex: 0 0 40%;
    flex-direction: column;
    justify-content: center;
    padding: 16px 20px;
    gap: 0;
  }
  .panel-brand::before, .panel-brand::after,
  .brand-circle, .deco-cross,
  .brand-eyebrow, .brand-divider, .brand-tagline,
  .brand-bottom { display: none; }
  .brand-top { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; flex: none; }
  .brand-icon-wrap { width: 44px; height: 44px; border-radius: 12px; margin-bottom: 0; }
  .brand-name { font-size: 28px; letter-spacing: 3px; margin-bottom: 2px; }
  .brand-full-name { font-size: 10px; max-width: 180px; }
  .panel-form { padding: 18px 24px; align-items: flex-start; overflow-y: auto; }
  .form-sub { margin-bottom: 16px; }
  .field { margin-bottom: 12px; }
  .form-security { margin-top: 14px; }
}

@media (max-width: 400px) {
  .panel-brand { padding: 22px 18px 20px; }
  .panel-form { padding: 28px 18px 36px; }
  .brand-name { font-size: 26px; }
  .form-title { font-size: 24px; }
}

@media (max-height: 600px) and (max-width: 768px) {
  .panel-brand { padding: 18px 20px; }
  .brand-icon-wrap { width: 40px; height: 40px; border-radius: 10px; }
  .brand-name { font-size: 24px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}
</style>

</div>

<!-- ══ PANNEAU DROIT — Formulaire ══ -->
<div class="panel-form">
  <div class="form-inner" id="form-inner">

    <div class="form-eyebrow">Accès sécurisé</div>

    <!-- Identifiant -->
    <div class="field">
      <label for="login-username">Identifiant</label>
      <div class="field-inner">
        <span class="field-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

          onkeydown="if(event.key==='Enter')document.getElementById('login-password').focus()">
      </div>
    </div>

    <!-- Mot de passe -->
    <div class="field">
      <label for="login-password">Mot de passe</label>
      <div class="field-inner">
        <span class="field-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </span>
        <input type="password" id="login-password" placeholder="••••••••"
          autocomplete="current-password"
          onkeydown="if(event.key==='Enter')doLogin()">
        <button type="button" class="pwd-toggle" id="pwd-toggle" aria-label="Afficher le mot de passe" onclick="togglePwd()">
          <svg id="pwd-eye" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>

    </div>

    <!-- Bouton -->
    <button class="btn-login" id="login-btn" onclick="doLogin()">
      <span class="btn-accent"></span>
      Se connecter
    </button>

    <!-- Erreur -->
    <div id="login-error"></div>

    <!-- Séparateur sécurité -->
    <div class="form-security">
      <div class="form-security-line"></div>
      <div class="form-security-text">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        Connexion chiffrée SSL
      </div>
      <div class="form-security-line"></div>
    </div>

  </div>
</div>

<script>
/* ── Config Supabase ── */
const SUPABASE_URL = 'https://uvxxbihlagfncraokqlg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_RPgz6piVcNONZOOcLmOCQw_5YPxZTd6';
const SESSION_KEY  = 'labo_session_user';
const SESSION_DURATION_MS = 24 * 60 * 60 * 1000;

/* ── Init Supabase ── */
let _sb = null;
function initSupabase() {
  if (!window.supabase) return false;
  try {
    _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    return true;
  } catch(e) { return false; }
}


/* ── Où envoyer quelqu'un après sa connexion ──
   Un soignant du centre n'ouvre jamais l'application du laboratoire : elle
   charge tout le registre en mémoire et lui serait de toute façon refusée
   par le serveur. Il a sa propre page, volontairement minuscule. */
function pageDAccueil(role) {
  return role === 'prescripteur' ? 'soignant.html' : 'index.html';
}

/* ── Vérification session existante ── */
function hasValidSession() {
  const raw = localStorage.getItem(SESSION_KEY);
  if (!raw) return false;
  try {
    const parsed = JSON.parse(raw);
    if (!parsed || !parsed.expiresAt || Date.now() > parsed.expiresAt || !parsed.id || !parsed.token) {
      localStorage.removeItem(SESSION_KEY);
      return false;
    }
    return true;
  } catch(e) { return false; }
}

/* ── Au chargement ── */
document.addEventListener('DOMContentLoaded', () => {
  if (hasValidSession()) {
    let r = null;
    try { r = JSON.parse(localStorage.getItem(SESSION_KEY) || '{}').role; } catch(e) {}
    window.location.replace(pageDAccueil(r));
    return;
  }
  initSupabase();
  document.getElementById('login-username').focus();

  /* PWA manifest inline */
  const manifest = {
    name: 'CPMI Labo',
    short_name: 'CPMI',
    start_url: 'https://madarasenku.github.io/labosaisie/index.html',
    scope: 'https://madarasenku.github.io/labosaisie/',
    display: 'standalone',
    theme_color: '#0b2545',
    background_color: '#0b2545',
    icons: [{ src: "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxOTIgMTkyIj48cmVjdCB3aWR0aD0iMTkyIiBoZWlnaHQ9IjE5MiIgcng9IjM4IiBmaWxsPSIjMWE0NDgwIi8+PHBhdGggZD0iTTk2IDU0Yy0xNiAwLTMwIDEyLjYtMzAgMzEuNSAwIDE0LjQgOC43IDI3IDIxIDMzLjl2MTAuMmMtMTMuNSAzLTI0IDEwLjgtMjguMiAyMWg3NC40Yy00LjItMTAuMi0xNS0xOC0yOC44LTIxdi0xMC4yYzEyLjMtNi45IDIxLTE5LjUgMjEtMzMuOUMxMjYgNjYuNiAxMTIgNTQgOTYgNTR6IiBmaWxsPSIjZmZmIi8+PGNpcmNsZSBjeD0iOTYiIGN5PSI0MiIgcj0iMTAiIGZpbGw9IiNmZmYiLz48ZyBmaWxsPSIjZmJiZjI0Ij48cmVjdCB4PSIxMzgiIHk9IjEyMCIgd2lkdGg9IjkuNiIgaGVpZ2h0PSIzMyIgcng9IjMuNiIvPjxyZWN0IHg9IjEyNCIgeT0iMTMzIiB3aWR0aD0iMzMiIGhlaWdodD0iOS42IiByeD0iMy42Ii8+PC9nPjwvc3ZnPg==", sizes: "192x192", type: "image/svg+xml" }]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
  document.getElementById('pwa-manifest').href = URL.createObjectURL(blob);

  /* Service Worker */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
});

/* ── Login ── */
async function doLogin() {
  const userInput = document.getElementById('login-username');
  const pwdInput  = document.getElementById('login-password');
  const errEl     = document.getElementById('login-error');
  const btn       = document.getElementById('login-btn');
  const inner     = document.getElementById('form-inner');

  const username = userInput.value.trim();
  const pwd = pwdInput.value;
  errEl.textContent = '';

  if (!username || !pwd) {
    errEl.textContent = "Veuillez saisir l'identifiant et le mot de passe.";
    shake(); return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="btn-accent"></span><span class="spinner"></span>Vérification…';

  if (!_sb && !initSupabase()) {
    errEl.textContent = '⚠ Impossible de contacter le serveur. Vérifiez votre connexion.';
    resetBtn(); return;
  }

  try {
    const { data, error } = await _sb.rpc('login_user', { p_username: username, p_password: pwd });

    if (error) {
      if (error.message?.includes('Could not find the function')) {
        errEl.textContent = '⚠ Base de données non initialisée.';
      } else if (error.message?.includes('JWT') || error.message?.includes('apikey') || error.message?.includes('Invalid API key')) {
        errEl.textContent = '⚠ Clé Supabase invalide.';
      } else if (error.message?.includes('Failed to fetch')) {
        errEl.textContent = '⚠ Serveur injoignable. Vérifiez votre connexion.';
      } else {
        errEl.textContent = 'Erreur : ' + (error.message || 'inconnue');
      }
      shake(); resetBtn(); return;
    }

    const raw = data && (Array.isArray(data) ? data[0] : data);
    const row = raw ? {
      id:             raw.id             ?? raw.id,
      username:       raw.username       ?? raw.uname,
      role:           raw.role           ?? raw.urole,
      token:          raw.token          ?? raw.utoken,
      status:         raw.status         ?? raw.ustatus,
      locked_seconds: raw.locked_seconds ?? raw.ulocked_secs ?? 0,
    } : null;

    if (row && row.status === 'ok') {
      const session = {
        id: row.id, username: row.username, role: row.role, token: row.token,
        expiresAt: Date.now() + SESSION_DURATION_MS
      };
      localStorage.setItem(SESSION_KEY, JSON.stringify(session));
      btn.innerHTML = '<span class="btn-accent"></span>✅ Connexion réussie…';
      window.location.replace(pageDAccueil(row.role));

    } else if (row && row.status === 'locked') {
      const mins = Math.max(1, Math.ceil((row.locked_seconds || 0) / 60));
      errEl.textContent = '🔒 Compte verrouillé — réessayez dans ' + mins + ' min.';
      pwdInput.value = '';
      shake(); resetBtn();
    } else {
      errEl.textContent = "Identifiant ou mot de passe incorrect.";
      pwdInput.value = '';
      pwdInput.focus();
      shake(); resetBtn();
    }
  } catch(e) {
    errEl.textContent = e.message?.includes('Failed to fetch')
      ? '⚠ Serveur injoignable. Vérifiez votre connexion.'
      : 'Erreur : ' + (e.message || 'connexion impossible');
    shake(); resetBtn();
  }
}

function resetBtn() {
  const btn = document.getElementById('login-btn');
  btn.disabled = false;
  btn.innerHTML = '<span class="btn-accent"></span>Se connecter';
}

function shake() {
  const inner = document.getElementById('form-inner');
  inner.classList.remove('shake');
  void inner.offsetWidth;
  inner.classList.add('shake');
}

/* ── Afficher / masquer le mot de passe ── */
function togglePwd() {
  const input = document.getElementById('login-password');
  const btn   = document.getElementById('pwd-toggle');
  const eye   = document.getElementById('pwd-eye');
  const show  = input.type === 'password';
  input.type  = show ? 'text' : 'password';
  btn.setAttribute('aria-label', show ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
  eye.innerHTML = show
    ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
    : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  input.focus({ preventScroll: true });
}
</script>
