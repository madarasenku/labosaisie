@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap');

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Root ── */
html, body {
  height: 100%;
  font-family: 'Nunito', system-ui, sans-serif;
}

/* ── Fond sombre profond ── */
body {
  min-height: 100vh;
  background: #050e1e;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow: hidden;
  position: relative;
}

/* ── Orbes animés en fond ── */
.orb {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  will-change: transform;
  filter: blur(90px);
  opacity: .55;
}
.orb-1 {
  width: 600px; height: 600px;
  background: radial-gradient(circle, #1a4480 0%, transparent 70%);
  top: -200px; left: -150px;
  animation: orbDrift1 20s ease-in-out infinite;
}
.orb-2 {
  width: 500px; height: 500px;
  background: radial-gradient(circle, #0d9488 0%, transparent 70%);
  bottom: -180px; right: -120px;
  animation: orbDrift2 26s ease-in-out infinite;
}
.orb-3 {
  width: 320px; height: 320px;
  background: radial-gradient(circle, #7c3aed 0%, transparent 70%);
  top: 50%; left: 60%;
  transform: translate(-50%, -50%);
  animation: orbDrift3 18s ease-in-out infinite;
  opacity: .25;
}

@keyframes orbDrift1 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33%       { transform: translate(60px, 40px) scale(1.08); }
  66%       { transform: translate(-30px, 70px) scale(.95); }
}
@keyframes orbDrift2 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%       { transform: translate(-70px, -50px) scale(1.12); }
}
@keyframes orbDrift3 {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  40%       { transform: translate(-50%, -50%) scale(1.4); }
}

/* ── Grille de points fine ── */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: radial-gradient(circle, rgba(255,255,255,.06) 1px, transparent 1px);
  background-size: 32px 32px;
  pointer-events: none;
  z-index: 0;
}

/* ── Contenant central ── */
.login-wrapper {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
}

/* ── Bloc marque (au-dessus de la carte) ── */
.brand-block {
  text-align: center;
  color: #fff;
  animation: fadeUp .7s cubic-bezier(.22,.61,.36,1) both;
}

.brand-logo {
  width: 80px; height: 80px;
  background: linear-gradient(135deg, rgba(26,68,128,.9) 0%, rgba(13,148,136,.8) 100%);
  border: 1.5px solid rgba(255,255,255,.18);
  border-radius: 22px;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 16px;
  box-shadow:
    0 0 0 8px rgba(26,68,128,.12),
    0 0 0 16px rgba(26,68,128,.06),
    0 16px 48px rgba(0,0,0,.4);
  animation: logoPulse 3.6s ease-in-out 1s infinite;
  backdrop-filter: blur(8px);
}
@keyframes logoPulse {
  0%, 100% { box-shadow: 0 0 0 8px rgba(26,68,128,.12), 0 0 0 16px rgba(26,68,128,.06), 0 16px 48px rgba(0,0,0,.4); }
  50%       { box-shadow: 0 0 0 10px rgba(13,148,136,.18), 0 0 0 22px rgba(13,148,136,.06), 0 20px 56px rgba(0,0,0,.45); }
}

.brand-name {
  font-size: 42px;
  font-weight: 900;
  letter-spacing: 6px;
  line-height: 1;
  margin-bottom: 6px;
  background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,.75) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.brand-full {
  font-size: 12px;
  font-weight: 600;
  opacity: .55;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.brand-sep {
  width: 40px; height: 2px;
  background: linear-gradient(to right, #0d9488, #2563eb);
  border-radius: 2px;
  margin: 10px auto 10px;
}
.brand-location {
  font-size: 11px;
  opacity: .38;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
}

/* ── Carte formulaire ── */
.login-card {
  width: 100%;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 20px;
  padding: 36px 32px 28px;
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  box-shadow:
    0 2px 0 rgba(255,255,255,.08) inset,
    0 32px 80px rgba(0,0,0,.45);
  animation: cardIn .65s .1s cubic-bezier(.22,.61,.36,1) both;
  position: relative;
  overflow: hidden;
}
/* Ligne de couleur en haut */
.login-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, #1a4480, #0d9488, #2563eb);
  border-radius: 20px 20px 0 0;
}

.login-card.shake { animation: shakeX .4s ease; }

.card-title {
  font-size: 20px;
  font-weight: 800;
  color: #fff;
  margin-bottom: 4px;
}
.card-sub {
  font-size: 12.5px;
  color: rgba(255,255,255,.45);
  font-weight: 500;
  margin-bottom: 28px;
}

/* ── Champs ── */
.field {
  margin-bottom: 16px;
}
.field label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  color: rgba(255,255,255,.55);
  letter-spacing: .5px;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.field-inner {
  position: relative;
  display: flex;
  align-items: center;
}
.field-icon {
  position: absolute;
  left: 14px;
  color: rgba(255,255,255,.35);
  font-size: 16px;
  pointer-events: none;
  line-height: 1;
}
.field input {
  width: 100%;
  padding: 14px 14px 14px 42px;
  background: rgba(255,255,255,.07);
  border: 1.5px solid rgba(255,255,255,.12);
  border-radius: 12px;
  font-size: 15px;
  font-family: inherit;
  color: #fff;
  outline: none;
  transition: border-color .2s, background .2s, box-shadow .2s;
  -webkit-appearance: none;
  min-height: 52px; /* touch-friendly */
}
.field input::placeholder { color: rgba(255,255,255,.25); }
.field input:focus {
  border-color: rgba(13,148,136,.7);
  background: rgba(255,255,255,.1);
  box-shadow: 0 0 0 4px rgba(13,148,136,.15);
}

/* ── Bouton connexion ── */
.btn-login {
  width: 100%;
  min-height: 52px;
  padding: 14px 20px;
  background: linear-gradient(135deg, #1a4480 0%, #0d9488 100%);
  border: none;
  border-radius: 12px;
  color: #fff;
  font-size: 15px;
  font-weight: 800;
  font-family: inherit;
  cursor: pointer;
  letter-spacing: .3px;
  position: relative;
  overflow: hidden;
  transition: opacity .2s, transform .15s, box-shadow .2s;
  box-shadow: 0 4px 20px rgba(13,148,136,.35), 0 1px 0 rgba(255,255,255,.1) inset;
  margin-top: 8px;
}
.btn-login::before {
  content: '';
  position: absolute; top: 0; left: -60%;
  width: 45%; height: 100%;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.22), transparent);
  transform: skewX(-18deg);
  transition: left .6s cubic-bezier(.4,0,.2,1);
  pointer-events: none;
}
.btn-login:hover:not(:disabled)::before { left: 120%; }
.btn-login:hover:not(:disabled) {
  box-shadow: 0 6px 28px rgba(13,148,136,.5), 0 1px 0 rgba(255,255,255,.12) inset;
  transform: translateY(-1px);
}
.btn-login:active { transform: translateY(0); }
.btn-login:disabled { opacity: .55; cursor: not-allowed; }

/* ── Erreur ── */
#login-error {
  color: #f87171;
  font-size: 12.5px;
  font-weight: 600;
  margin-top: 12px;
  min-height: 16px;
  line-height: 1.5;
}

/* ── Spinner ── */
.spinner {
  display: inline-block;
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,.35);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .7s linear infinite;
  vertical-align: middle;
  margin-right: 8px;
}

/* ── Badges de bas de page ── */
.brand-footer {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 4px;
}
.brand-badge {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .4px;
  color: rgba(255,255,255,.35);
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.09);
  border-radius: 100px;
  padding: 4px 12px;
}

/* ── Animations ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(30px) scale(.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes shakeX {
  0%, 100%      { transform: translateX(0); }
  20%, 60%      { transform: translateX(-7px); }
  40%, 80%      { transform: translateX(7px); }
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Responsive ── */
@media (max-width: 460px) {
  body { padding: 16px; align-items: flex-start; padding-top: 40px; }
  .brand-name { font-size: 34px; letter-spacing: 4px; }
  .login-card { padding: 28px 20px 22px; }
  .brand-logo { width: 68px; height: 68px; border-radius: 18px; }
  .login-wrapper { gap: 20px; }
}

@media (max-height: 640px) {
  body { align-items: flex-start; padding-top: 24px; }
  .brand-logo { width: 60px; height: 60px; border-radius: 16px; }
  .brand-name { font-size: 30px; }
  .login-wrapper { gap: 16px; }
  .login-card { padding: 24px 20px 18px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}
</style>
</head>

<script>
/* ── Config Supabase ── */
const SUPABASE_URL = 'https://uvxxbihlagfncraokqlg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_RPgz6piVcNONZOOcLmOCQw_5YPxZTd6';
const SESSION_KEY  = 'labo_session_user';
const SESSION_DURATION_MS = 24 * 60 * 60 * 1000;

/* ── Init Supabase ── */
let _sb = null;
function initSupabase() {
  if (!window.supabase) return false;
  try {
    _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    return true;
  } catch(e) { return false; }
}

/* ── Vérification session existante ── */
function hasValidSession() {
  const raw = localStorage.getItem(SESSION_KEY);
  if (!raw) return false;
  try {
    const parsed = JSON.parse(raw);
    if (!parsed || !parsed.expiresAt || Date.now() > parsed.expiresAt || !parsed.id || !parsed.token) {
      localStorage.removeItem(SESSION_KEY);
      return false;
    }
    return true;
  } catch(e) { return false; }
}

/* ── Au chargement ── */
document.addEventListener('DOMContentLoaded', () => {
  if (hasValidSession()) {
    window.location.replace('index.html');
    return;
  }
  initSupabase();
  document.getElementById('login-username').focus();

  /* PWA manifest inline */
  const manifest = {
    name: 'CPMI Labo',
    short_name: 'CPMI',
    start_url: 'https://madarasenku.github.io/labosaisie/index.html',
    scope: 'https://madarasenku.github.io/labosaisie/',
    display: 'standalone',
    theme_color: '#050e1e',
    background_color: '#050e1e',
    icons: [{ src: "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxOTIgMTkyIj48cmVjdCB3aWR0aD0iMTkyIiBoZWlnaHQ9IjE5MiIgcng9IjM4IiBmaWxsPSIjMWE0NDgwIi8+PHBhdGggZD0iTTk2IDU0Yy0xNiAwLTMwIDEyLjYtMzAgMzEuNSAwIDE0LjQgOC43IDI3IDIxIDMzLjl2MTAuMmMtMTMuNSAzLTI0IDEwLjgtMjguMiAyMWg3NC40Yy00LjItMTAuMi0xNS0xOC0yOC44LTIxdi0xMC4yYzEyLjMtNi45IDIxLTE5LjUgMjEtMzMuOUMxMjYgNjYuNiAxMTIgNTQgOTYgNTR6IiBmaWxsPSIjZmZmIi8+PGNpcmNsZSBjeD0iOTYiIGN5PSI0MiIgcj0iMTAiIGZpbGw9IiNmZmYiLz48ZyBmaWxsPSIjZmJiZjI0Ij48cmVjdCB4PSIxMzgiIHk9IjEyMCIgd2lkdGg9IjkuNiIgaGVpZ2h0PSIzMyIgcng9IjMuNiIvPjxyZWN0IHg9IjEyNCIgeT0iMTMzIiB3aWR0aD0iMzMiIGhlaWdodD0iOS42IiByeD0iMy42Ii8+PC9nPjwvc3ZnPg==", sizes: "192x192", type: "image/svg+xml" }]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
  document.getElementById('pwa-manifest').href = URL.createObjectURL(blob);

  /* Service Worker */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
});

/* ── Login ── */
async function doLogin() {
  const userInput = document.getElementById('login-username');
  const pwdInput  = document.getElementById('login-password');
  const errEl     = document.getElementById('login-error');
  const btn       = document.getElementById('login-btn');
  const card      = document.getElementById('login-card');

  const username = userInput.value.trim();
  const pwd = pwdInput.value;
  errEl.textContent = '';

  if (!username || !pwd) {
    errEl.textContent = "Veuillez saisir l'identifiant et le mot de passe.";
    shake(); return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Vérification…';

  if (!_sb && !initSupabase()) {
    errEl.textContent = '⚠ Impossible de contacter le serveur. Vérifiez votre connexion.';
    resetBtn(); return;
  }

  try {
    const { data, error } = await _sb.rpc('login_user', { p_username: username, p_password: pwd });

    if (error) {
      if (error.message?.includes('Could not find the function')) {
        errEl.textContent = '⚠ Base de données non initialisée.';
      } else if (error.message?.includes('JWT') || error.message?.includes('apikey') || error.message?.includes('Invalid API key')) {
        errEl.textContent = '⚠ Clé Supabase invalide.';
      } else if (error.message?.includes('Failed to fetch')) {
        errEl.textContent = '⚠ Serveur injoignable. Vérifiez votre connexion.';
      } else {
        errEl.textContent = 'Erreur : ' + (error.message || 'inconnue');
      }
      shake(); resetBtn(); return;
    }

    const raw = data && (Array.isArray(data) ? data[0] : data);
    const row = raw ? {
      id:             raw.id             ?? raw.id,
      username:       raw.username       ?? raw.uname,
      role:           raw.role           ?? raw.urole,
      token:          raw.token          ?? raw.utoken,
      status:         raw.status         ?? raw.ustatus,
      locked_seconds: raw.locked_seconds ?? raw.ulocked_secs ?? 0,
    } : null;

    if (row && row.status === 'ok') {
      const session = {
        id: row.id, username: row.username, role: row.role, token: row.token,
        expiresAt: Date.now() + SESSION_DURATION_MS
      };
      localStorage.setItem(SESSION_KEY, JSON.stringify(session));
      btn.innerHTML = '✅ Connexion réussie…';
      window.location.replace('index.html');

    } else if (row && row.status === 'locked') {
      const mins = Math.max(1, Math.ceil((row.locked_seconds || 0) / 60));
      errEl.textContent = '🔒 Compte verrouillé — réessayez dans ' + mins + ' min.';
      pwdInput.value = '';
      shake(); resetBtn();
    } else {
      errEl.textContent = "Identifiant ou mot de passe incorrect.";
      pwdInput.value = '';
      pwdInput.focus();
      shake(); resetBtn();
    }
  } catch(e) {
    errEl.textContent = e.message?.includes('Failed to fetch')
      ? '⚠ Serveur injoignable. Vérifiez votre connexion.'
      : 'Erreur : ' + (e.message || 'connexion impossible');
    shake(); resetBtn();
  }
}

function resetBtn() {
  const btn = document.getElementById('login-btn');
  btn.disabled = false;
  btn.innerHTML = 'Se connecter';
}

function shake() {
  const card = document.getElementById('login-card');
  card.classList.remove('shake');
  void card.offsetWidth;
  card.classList.add('shake');
}
</script>
</body>
</html>
