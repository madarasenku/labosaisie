<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap');

:root {
  --deep:   #0e2240;
  --mid:    #1a4480;
  --blue:   #2563eb;
  --teal:   #0d9488;
  --rose:   #e11d76;
  --danger: #dc2626;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  font-family: 'Nunito', system-ui, sans-serif;
  height: 100vh;
  display: flex;
  overflow: hidden;
}

/* ─── Split layout ─── */
.split { display: flex; width: 100%; height: 100%; }

/* ─── LEFT : panneau marque ─── */
.brand {
  flex: 0 0 400px;
  background: linear-gradient(158deg, #0e2240 0%, #1a4480 55%, #0c5f70 100%);
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 48px;
  overflow: hidden;
  color: #fff;
}

/* Grille de points */
.brand-dots {
  position: absolute; inset: 0;
  background-image: radial-gradient(circle, rgba(255,255,255,.07) 1px, transparent 1px);
  background-size: 26px 26px;
  pointer-events: none;
}

/* Cercles décoratifs */
.brand-ring-1 {
  position: absolute;
  width: 520px; height: 520px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,.05);
  top: -170px; left: -170px;
}
.brand-ring-2 {
  position: absolute;
  width: 340px; height: 340px; border-radius: 50%;
  border: 1px solid rgba(13,148,136,.18);
  bottom: -90px; right: -90px;
  background: radial-gradient(circle, rgba(13,148,136,.07) 0%, transparent 70%);
}
.brand-ring-3 {
  position: absolute;
  width: 220px; height: 220px; border-radius: 50%;
  background: radial-gradient(circle, rgba(37,99,235,.14) 0%, transparent 70%);
  top: 50%; left: 50%; transform: translate(-50%, -50%);
}

.brand-content { position: relative; z-index: 1; text-align: center; }

.brand-logo {
  width: 92px; height: 92px;
  background: rgba(255,255,255,.11);
  border: 1.5px solid rgba(255,255,255,.2);
  border-radius: 24px;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 28px;
  backdrop-filter: blur(10px);
  box-shadow: 0 20px 50px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.15);
  animation: logoIn .85s cubic-bezier(.22,.61,.36,1) both;
}

.brand-name {
  font-size: 38px; font-weight: 900; letter-spacing: 3px; margin-bottom: 8px;
  animation: textIn .8s .1s cubic-bezier(.22,.61,.36,1) both;
}

.brand-fullname {
  font-size: 13px; font-weight: 500; opacity: .72; line-height: 1.6;
  max-width: 230px; margin: 0 auto;
  animation: textIn .8s .2s cubic-bezier(.22,.61,.36,1) both;
}

.brand-line {
  width: 36px; height: 2px;
  background: linear-gradient(to right, var(--teal), var(--rose));
  border-radius: 2px; margin: 20px auto;
  animation: textIn .8s .25s cubic-bezier(.22,.61,.36,1) both;
}

.brand-location {
  font-size: 10.5px; opacity: .44; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase;
  animation: textIn .8s .3s cubic-bezier(.22,.61,.36,1) both;
}

.brand-badges {
  display: flex; gap: 8px; justify-content: center; margin-top: 32px;
  flex-wrap: wrap;
  animation: textIn .8s .4s cubic-bezier(.22,.61,.36,1) both;
}
.brand-badge {
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 100px; padding: 4px 13px;
  font-size: 10px; font-weight: 700; letter-spacing: .4px; opacity: .75;
}

@keyframes logoIn {
  from { opacity: 0; transform: scale(.6) translateY(20px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes textIn {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ─── RIGHT : panneau formulaire ─── */
.form-side {
  flex: 1;
  background: #f4f7ff;
  display: flex; align-items: center; justify-content: center;
  padding: 40px 32px;
  position: relative; overflow: hidden;
}
.form-side::before {
  content: '';
  position: absolute; top: -80px; right: -80px;
  width: 340px; height: 340px; border-radius: 50%;
  background: radial-gradient(circle, rgba(37,99,235,.05) 0%, transparent 65%);
}
.form-side::after {
  content: '';
  position: absolute; bottom: -60px; left: -60px;
  width: 240px; height: 240px; border-radius: 50%;
  background: radial-gradient(circle, rgba(13,148,136,.05) 0%, transparent 65%);
}

.login-card {
  width: 100%; max-width: 390px;
  background: #fff;
  border-radius: 22px;
  padding: 46px 42px;
  border: 1px solid rgba(199,215,245,.65);
  box-shadow: 0 4px 6px rgba(26,68,128,.04), 0 24px 60px rgba(26,68,128,.10);
  position: relative;
  animation: cardIn .65s .15s cubic-bezier(.22,.61,.36,1) both;
}

/* Barre de couleur en haut */
.login-card::before {
  content: '';
  position: absolute; top: 0; left: 36px; right: 36px; height: 3px;
  background: linear-gradient(to right, var(--mid), var(--teal), var(--rose));
  border-radius: 0 0 4px 4px;
}

.login-card.shake { animation: shakeX .45s ease; }

@keyframes cardIn {
  from { opacity: 0; transform: translateY(24px) scale(.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes shakeX {
  0%, 100%      { transform: translateX(0); }
  15%, 45%, 75% { transform: translateX(-6px); }
  30%, 60%, 90% { transform: translateX(6px); }
}

.login-title { font-size: 23px; font-weight: 900; color: #0e2240; margin-bottom: 5px; }
.login-sub   { font-size: 13px; color: #6b7fa3; font-weight: 500; margin-bottom: 34px; }

.field { margin-bottom: 18px; }
.field label {
  display: block; font-size: 11.5px; font-weight: 700;
  color: #4a5c82; margin-bottom: 7px; letter-spacing: .3px;
}
.field input {
  width: 100%; padding: 11px 14px;
  border: 1.5px solid #c7d7f5; border-radius: 11px;
  font-size: 14px; font-family: inherit; color: #0f1f40;
  background: #f8faff; outline: none;
  transition: border-color .2s, box-shadow .2s, background .2s;
}
.field input::placeholder { color: #9aabc8; }
.field input:focus {
  border-color: #2563eb; background: #fff;
  box-shadow: 0 0 0 4px rgba(37,99,235,.10);
}

.btn-login {
  width: 100%; padding: 13px;
  background: linear-gradient(135deg, #0e2240, #2563eb);
  color: #fff; border: none; border-radius: 11px;
  font-size: 15px; font-weight: 700; font-family: inherit;
  cursor: pointer; position: relative; overflow: hidden;
  transition: opacity .2s, transform .15s, box-shadow .2s;
  box-shadow: 0 4px 18px rgba(26,68,128,.32);
  margin-top: 4px;
}
.btn-login::before {
  content: '';
  position: absolute; top: 0; left: -55%;
  width: 40%; height: 100%;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.3), transparent);
  transform: skewX(-18deg);
  transition: left .6s cubic-bezier(.4,0,.2,1);
  pointer-events: none;
}
.btn-login:hover::before { left: 115%; }
.btn-login:hover { box-shadow: 0 6px 24px rgba(26,68,128,.42); transform: translateY(-1px); }
.btn-login:active { transform: translateY(0); }
.btn-login:disabled { opacity: .6; cursor: not-allowed; transform: none !important; }

#login-error {
  color: var(--danger); font-size: 12.5px; font-weight: 600;
  margin-top: 14px; min-height: 16px; line-height: 1.45;
}

.spinner {
  display: inline-block; width: 15px; height: 15px;
  border: 2px solid rgba(255,255,255,.4); border-top-color: #fff;
  border-radius: 50%; animation: spin .7s linear infinite;
  vertical-align: middle; margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── Mobile ─── */
@media (max-width: 680px) {
  .brand { display: none; }
  body {
    background: linear-gradient(158deg, #0e2240 0%, #1a4480 100%);
    align-items: center; justify-content: center; padding: 20px;
  }
  .split { display: block; }
  .form-side { background: transparent; padding: 0; display: block; }
  .form-side::before, .form-side::after { display: none; }
  .login-card { border-color: rgba(255,255,255,.12); box-shadow: 0 30px 80px rgba(0,0,0,.4); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}
</style>
</head>
<body>

<div class="split">

  <!-- Panneau gauche : identité CPMI -->
  <div class="brand">
    <div class="brand-dots"></div>
    <div class="brand-ring-1"></div>
    <div class="brand-ring-2"></div>
    <div class="brand-ring-3"></div>

    <div class="brand-content">
      <div class="brand-logo">
        <svg viewBox="0 0 64 64" width="50" height="50" xmlns="http://www.w3.org/2000/svg">
          <path d="M32 16c-5.5 0-10 4.2-10 10.5 0 4.8 2.9 9 7 11.3v3.4c-4.5 1-8 3.6-9.4 7h25c-1.4-3.5-5-6-9.6-7v-3.4c4.1-2.3 7-6.5 7-11.3C42 20.2 37.5 16 32 16z" fill="#fff"/>
          <circle cx="32" cy="14" r="3.4" fill="#fff"/>
          <path d="M27 12.5c0-2.8 2.2-5 5-5s5 2.2 5 5" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.9"/>
          <g>
            <rect x="46" y="40" width="3.2" height="11" rx="1.2" fill="#fbbf24"/>
            <rect x="41.4" y="44.4" width="11" height="3.2" rx="1.2" fill="#fbbf24"/>
          </g>
        </svg>
      </div>

      <div class="brand-name">CPMI</div>
      <div class="brand-fullname">Centre de Protection<br>Mère et Infantile</div>
      <div class="brand-line"></div>
      <div class="brand-location">Grand-Bassam · Côte d'Ivoire</div>

      <div class="brand-badges">
        <span class="brand-badge">Analyses médicales</span>
        <span class="brand-badge">Laboratoire</span>
      </div>
    </div>
  </div>

  <!-- Panneau droit : formulaire -->
  <div class="form-side">
    <div class="login-card" id="login-card">
      <div class="login-title">Connexion</div>
      <div class="login-sub">Portail du laboratoire CPMI</div>

      <div class="field">
        <label for="login-username">Nom d'utilisateur</label>
        <input type="text" id="login-username" placeholder="Votre identifiant" autocomplete="username"
          onkeydown="if(event.key==='Enter')document.getElementById('login-password').focus()">
      </div>

      <div class="field">
        <label for="login-password">Mot de passe</label>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"
          onkeydown="if(event.key==='Enter')doLogin()">
      </div>

      <button class="btn-login" id="login-btn" onclick="doLogin()">🔐 Se connecter</button>
      <div id="login-error"></div>
    </div>
  </div>

</div>

<script>
/* ── Config Supabase ── */
const SUPABASE_URL = 'https://uvxxbihlagfncraokqlg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_RPgz6piVcNONZOOcLmOCQw_5YPxZTd6';
const SESSION_KEY  = 'labo_session_user';
const SESSION_DURATION_MS = 24 * 60 * 60 * 1000;

/* ── Init Supabase ── */
let _sb = null;
function initSupabase() {
  if (!window.supabase) return false;
  try {
    _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    return true;
  } catch(e) { return false; }
}

/* ── Vérification session existante ── */
function hasValidSession() {
  const raw = localStorage.getItem(SESSION_KEY);
  if (!raw) return false;
  try {
    const parsed = JSON.parse(raw);
    if (!parsed || !parsed.expiresAt || Date.now() > parsed.expiresAt || !parsed.id || !parsed.token) {
      localStorage.removeItem(SESSION_KEY);
      return false;
    }
    return true;
  } catch(e) { return false; }
}

/* ── Au chargement : si session valide → rediriger direct vers l'app ── */
document.addEventListener('DOMContentLoaded', () => {
  if (hasValidSession()) {
    window.location.replace('index.html');
    return;
  }
  initSupabase();
  document.getElementById('login-username').focus();

  /* Service Worker pour PWA */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
});

/* ── Login ── */
async function doLogin() {
  const userInput = document.getElementById('login-username');
  const pwdInput  = document.getElementById('login-password');
  const errEl     = document.getElementById('login-error');
  const btn       = document.getElementById('login-btn');
  const card      = document.getElementById('login-card');

  const username = userInput.value.trim();
  const pwd = pwdInput.value;
  errEl.textContent = '';

  if (!username || !pwd) {
    errEl.textContent = "Veuillez saisir le nom d'utilisateur et le mot de passe.";
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Vérification…';

  if (!_sb && !initSupabase()) {
    errEl.textContent = '⚠ Impossible de contacter le serveur. Vérifiez votre connexion.';
    resetBtn(); return;
  }

  try {
    const { data, error } = await _sb.rpc('login_user', { p_username: username, p_password: pwd });

    if (error) {
      if (error.message?.includes('Could not find the function')) {
        errEl.textContent = '⚠ Base de données non initialisée. Exécutez le script SQL dans Supabase.';
      } else if (error.message?.includes('JWT') || error.message?.includes('apikey') || error.message?.includes('Invalid API key')) {
        errEl.textContent = '⚠ Clé Supabase invalide. Vérifiez SUPABASE_KEY.';
      } else if (error.message?.includes('Failed to fetch')) {
        errEl.textContent = '⚠ Serveur injoignable. Vérifiez votre connexion internet.';
      } else {
        errEl.textContent = 'Erreur serveur : ' + (error.message || 'inconnue');
      }
      shake(); resetBtn(); return;
    }

    const raw = data && (Array.isArray(data) ? data[0] : data);
    const row = raw ? {
      id:             raw.id             ?? raw.id,
      username:       raw.username       ?? raw.uname,
      role:           raw.role           ?? raw.urole,
      token:          raw.token          ?? raw.utoken,
      status:         raw.status         ?? raw.ustatus,
      locked_seconds: raw.locked_seconds ?? raw.ulocked_secs ?? 0,
    } : null;

    if (row && row.status === 'ok') {
      const session = {
        id: row.id, username: row.username, role: row.role, token: row.token,
        expiresAt: Date.now() + SESSION_DURATION_MS
      };
      localStorage.setItem(SESSION_KEY, JSON.stringify(session));
      btn.innerHTML = '✅ Connexion réussie…';
      window.location.replace('index.html');

    } else if (row && row.status === 'locked') {
      const mins = Math.max(1, Math.ceil((row.locked_seconds || 0) / 60));
      errEl.textContent = '🔒 Trop de tentatives. Compte verrouillé — réessayez dans ' + mins + ' min.';
      pwdInput.value = '';
      shake(); resetBtn();
    } else {
      errEl.textContent = "Nom d'utilisateur ou mot de passe incorrect.";
      pwdInput.value = '';
      pwdInput.focus();
      shake(); resetBtn();
    }
  } catch(e) {
    errEl.textContent = e.message?.includes('Failed to fetch')
      ? '⚠ Serveur injoignable. Vérifiez votre connexion internet.'
      : 'Erreur : ' + (e.message || 'connexion impossible');
    shake(); resetBtn();
  }
}

function resetBtn() {
  const btn = document.getElementById('login-btn');
  btn.disabled = false;
  btn.innerHTML = '🔐 Se connecter';
}

function shake() {
  const card = document.getElementById('login-card');
  card.classList.remove('shake');
  void card.offsetWidth;
  card.classList.add('shake');
}
</script>
</body>
</html>
