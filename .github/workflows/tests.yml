name: Tests

# Les tests ne servent à rien s'ils ne tournent que quand on y pense.
on:
  # Toutes les branches, pas seulement main : une branche de travail doit
  # être testée pendant qu'on la développe, pas seulement au moment de la
  # fusion — c'est là qu'un retour coûte le moins cher à corriger.
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  # Exécution quotidienne : les tests dépendent de la date du jour
  # (périodes « aujourd'hui », « cette semaine », mois courant / précédent).
  # Un passage quotidien attrape tout de suite un cas de bord de calendrier —
  # le 1er du mois, un lundi, une fin de mois courte — plutôt que le jour où
  # quelqu'un pousse du code et se retrouve face à un échec déroutant.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

# Anti-doublon : sans cela, pousser sur une branche qui a une PR ouverte vers
# main déclenchait DEUX runs identiques sur le même commit (l'événement `push`
# ET l'événement `pull_request`). On regroupe les deux par nom de branche
# (`head_ref` existe pour une PR, `ref_name` pour un push) et on annule le run
# le plus ancien : il n'en reste qu'un seul par branche, sans perdre le test
# des branches de travail ni celui des PR.
concurrency:
  group: tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Le dépôt apt « google-chrome » préinstallé sur les runners Ubuntu a parfois
      # un index corrompu (Hash Sum mismatch) : cela fait échouer `apt-get update`
      # — donc `playwright install --with-deps` — avant même le moindre test, alors
      # que Playwright utilise son PROPRE Chromium (aucun besoin de Google Chrome).
      # On retire ce dépôt pour que l'installation des dépendances système passe.
      - name: Neutraliser le dépôt Chrome (évite un échec apt transitoire)
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome*.list

      - name: Installer Playwright et Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Vérifier la syntaxe des modules
        run: |
          for f in js/*.js sw.js tests/*.js; do
            node --check "$f" || exit 1
          done
          echo "Tous les modules parsent."

      - name: Lancer la suite de tests
        run: node tests/run.js
