<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: 'Segoe UI', system-ui, Arial, sans-serif;
    background: linear-gradient(135deg, #0b2545 0%, #0891b2 100%); color: #fff; padding: 24px;
  }
  .card {
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18);
    border-radius: 18px; padding: 32px 28px; max-width: 440px; width: 100%; text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  .code { font-size: 54px; font-weight: 800; letter-spacing: 1px; line-height: 1; }
  h1 { font-size: 18px; margin: 10px 0 6px; font-weight: 700; }
  p { font-size: 14px; opacity: .9; margin: 0 0 18px; }
  a.btn {
    display: inline-block; background: #fff; color: #0b2545; text-decoration: none;

<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Page introuvable</h1>
    <p>Cette adresse n'existe pas dans l'application du laboratoire CPMI.</p>
    <a class="btn" id="go" href="./login.html">↩ Retour à la connexion</a>
    <div class="sub">Centre de Protection Mère et Infantile · Grand-Bassam</div>
  </div>
  <script>
    // Redirige vers la connexion à la racine du site (compatible GitHub Pages
    // « projet » /labosaisie/ comme un domaine propre). Sans script, le bouton
    // relatif ci-dessus reste cliquable.
    (function () {
      try {
        var base = location.hostname.indexOf('github.io') !== -1
          ? '/' + (location.pathname.split('/')[1] || '') + '/'
          : '/';
        var dest = base + 'login.html';
        var go = document.getElementById('go');
        if (go) go.setAttribute('href', dest);
        setTimeout(function () { location.replace(dest); }, 2500);
      } catch (e) {}
    })();
  </script>
